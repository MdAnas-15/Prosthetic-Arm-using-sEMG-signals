[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prosthetic-arm-combined"
version = "1.1.0"
description = "CNN-GRU sEMG recognition, webcam hand tracking and PyBullet prosthetic-arm simulation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["prosthetic_semg*", "prosthetic_sim*", "integration*"]

name: Python tests

on:
  push:
    branches:
      - fix/camera-sem-g-control
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2 matplotlib==3.9.2 "pytest>=8,<9"
          python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu

      - name: Compile project modules
        run: python -m compileall -q main.py integration prosthetic_semg prosthetic_sim scripts

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
